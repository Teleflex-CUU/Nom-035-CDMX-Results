<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#0D2B5A;--navy2:#1A3F7A;--teal:#00796B;
  --white:#fff;--bg:#F0F4FA;--bg2:#E8EEF6;
  --text:#0F172A;--text2:#475569;--text3:#94A3B8;
  --border:#E2E8F0;--border2:#CBD5E1;
  --green:#15803D;--amber:#B45309;--red:#991B1B;--purple:#6D28D9;
  --c-nulo:#15803D;--c-bajo:#B45309;--c-medio:#C05621;--c-alto:#991B1B;--c-muy_alto:#6D28D9;
  --bg-nulo:#D1FAE5;--bg-bajo:#FEF3C7;--bg-medio:#FFEDD5;--bg-alto:#FEE2E2;--bg-muy_alto:#EDE9FE;
  --r:10px;--r2:14px;--font:system-ui,-apple-system,sans-serif;
}
body{font-family:var(--font);background:var(--bg);color:var(--text);display:flex;height:100vh;overflow:hidden}

/* SIDEBAR */
.sb{width:230px;background:linear-gradient(180deg,var(--navy) 0%,#0a2050 100%);display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto}
.sb-logo{padding:20px 18px 14px;border-bottom:1px solid rgba(255,255,255,.08)}
.sb-logo h1{font-size:14px;font-weight:800;color:#fff;line-height:1.3}
.sb-logo p{font-size:10.5px;color:rgba(255,255,255,.45);margin-top:2px}
.sb-logo .cdmx-tag{display:inline-block;background:rgba(255,255,255,.12);border-radius:20px;
  padding:2px 10px;font-size:10px;color:rgba(255,255,255,.7);margin-top:6px;font-weight:600}
.sb-doctor{padding:10px 18px;border-bottom:1px solid rgba(255,255,255,.08)}
.sb-doctor strong{color:rgba(255,255,255,.85);display:block;font-size:11.5px}
.sb-doctor p{font-size:10px;color:rgba(255,255,255,.5);line-height:1.6;margin-top:1px}
.sb-sec{padding:8px 18px 3px;font-size:9.5px;font-weight:700;color:rgba(255,255,255,.3);
  letter-spacing:1.2px;text-transform:uppercase}
.sb-btn{display:flex;align-items:center;gap:10px;width:100%;padding:9px 18px;background:none;
  border:none;color:rgba(255,255,255,.65);font-size:12.5px;cursor:pointer;text-align:left;
  transition:all .15s;border-left:3px solid transparent}
.sb-btn:hover{background:rgba(255,255,255,.07);color:#fff}
.sb-btn.active{background:rgba(255,255,255,.12);color:#fff;font-weight:700;border-left-color:rgba(255,255,255,.6)}
.sb-btn .ic{font-size:14px;width:18px;text-align:center;flex-shrink:0}
.sb-cnt{margin-left:auto;background:rgba(255,255,255,.12);border-radius:10px;
  padding:1px 7px;font-size:10px}
.sb-status{margin-top:auto;padding:12px 18px;border-top:1px solid rgba(255,255,255,.08);
  font-size:10px;color:rgba(255,255,255,.35)}
.sb-status .dot{display:inline-block;width:6px;height:6px;border-radius:50%;
  background:#374151;margin-right:5px;transition:background .3s}
.sb-status .dot.on{background:#22C55E}

/* MAIN */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{background:var(--white);border-bottom:1px solid var(--border);padding:12px 22px;
  display:flex;align-items:center;justify-content:space-between;gap:12px;flex-shrink:0;
  box-shadow:0 1px 3px rgba(0,0,0,.05)}
.topbar h2{font-size:16px;font-weight:800;color:var(--navy)}
.topbar-right{display:flex;align-items:center;gap:8px}
.sync-info{font-size:11px;color:var(--text3)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:var(--r);
  border:none;font-size:12px;font-weight:700;cursor:pointer;transition:opacity .15s;font-family:var(--font)}
.btn:hover{opacity:.85}
.btn-navy{background:var(--navy);color:#fff}
.btn-outline{background:var(--white);color:var(--navy);border:1.5px solid var(--border2)}
.btn-teal{background:var(--teal);color:#fff}
.btn-sm{padding:5px 11px;font-size:11px}
.content{flex:1;overflow-y:auto;padding:22px}

/* CARDS */
.card{background:var(--white);border-radius:var(--r2);border:1px solid var(--border);
  padding:18px 20px;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.card-title{font-size:13px;font-weight:700;color:var(--navy);margin-bottom:14px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.grid-5{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.gap-16{gap:16px}
.mb-16{margin-bottom:16px}

/* STATS */
.stat{background:var(--white);border-radius:var(--r2);border:1px solid var(--border);
  padding:16px 18px;text-align:center;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.stat-lbl{font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;
  letter-spacing:.8px;margin-bottom:8px}
.stat-val{font-size:30px;font-weight:800;color:var(--navy);line-height:1}
.stat-sub{font-size:10px;color:var(--text3);margin-top:5px}

/* BADGE */
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:20px;
  font-size:11px;font-weight:700}
.badge::before{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;background:currentColor}
.badge-nulo{background:var(--bg-nulo);color:var(--c-nulo)}
.badge-bajo{background:var(--bg-bajo);color:var(--c-bajo)}
.badge-medio{background:var(--bg-medio);color:var(--c-medio)}
.badge-alto{background:var(--bg-alto);color:var(--c-alto)}
.badge-muy_alto{background:var(--bg-muy_alto);color:var(--c-muy_alto)}

/* TABLE */
.tbl-wrap{overflow-x:auto;border-radius:var(--r);border:1px solid var(--border)}
table{width:100%;border-collapse:collapse;font-size:12.5px}
thead tr{background:var(--navy)}
thead th{padding:10px 12px;color:#fff;text-align:left;font-size:11px;font-weight:600;white-space:nowrap}
tbody tr{border-bottom:1px solid var(--border);transition:background .1s}
tbody tr:hover{background:var(--bg)}
tbody tr:last-child{border-bottom:none}
tbody td{padding:9px 12px}
tfoot tr{background:var(--bg2);font-weight:700}
tfoot td{padding:9px 12px;font-size:12px}

/* DOM BARS */
.dom-row{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--border)}
.dom-row:last-child{border-bottom:none}
.dom-lbl{width:190px;font-size:12px;color:var(--text2);flex-shrink:0;line-height:1.3}
.dom-bg{flex:1;height:10px;background:var(--bg2);border-radius:5px;overflow:hidden}
.dom-bar{height:100%;border-radius:5px;transition:width .6s ease}
.dom-pct{width:38px;text-align:right;font-size:12px;font-weight:700;color:var(--text)}
.dom-nivel{width:76px;text-align:right}

/* PROGRESS */
.prog-bg{background:var(--bg2);border-radius:8px;overflow:hidden}
.prog-fill{border-radius:8px;transition:width .7s ease}

/* MODAL */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;
  align-items:center;justify-content:center}
.modal-bg.show{display:flex}
.modal{background:var(--white);border-radius:var(--r2);padding:26px;max-width:580px;
  width:90%;max-height:85vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.modal-title{font-size:15px;font-weight:800;color:var(--navy);margin-bottom:16px;
  padding-bottom:12px;border-bottom:1px solid var(--border)}
.modal-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.mf label{font-size:9px;font-weight:700;color:var(--text3);text-transform:uppercase;
  letter-spacing:.8px;display:block;margin-bottom:2px}
.mf span{font-size:13px;font-weight:600}

/* PDF OVERLAY */
.pdf-ov{display:none;position:fixed;inset:0;background:rgba(13,43,90,.88);z-index:200;
  flex-direction:column;align-items:center;justify-content:center;gap:16px}
.pdf-ov.show{display:flex}
.pdf-spin{width:42px;height:42px;border:4px solid rgba(255,255,255,.2);
  border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}
.pdf-msg{color:#fff;font-size:16px;font-weight:700}
.pdf-sub{color:rgba(255,255,255,.55);font-size:12px}
@keyframes spin{to{transform:rotate(360deg)}}

/* FILTER */
.filter-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.filter-row select,.filter-row input{padding:7px 12px;border:1.5px solid var(--border2);
  border-radius:var(--r);font-size:12.5px;color:var(--text);background:var(--white);font-family:var(--font)}

/* STICKY THEAD */
.tbl-scroll{max-height:560px;overflow-y:auto}
.tbl-scroll thead{position:sticky;top:0;z-index:1}
</style>
</head>

// ══ HELPERS ══
function nivelG2(s){s=+s||0;return s<=20?'nulo':s<=45?'bajo':s<=70?'medio':s<=90?'alto':'muy_alto';}
function nivelG3(s){s=+s||0;return s<=50?'nulo':s<=75?'bajo':s<=99?'medio':s<=140?'alto':'muy_alto';}
function nivelDom(r,s){s=+s||0;return s<=r[0]?'nulo':s<=r[1]?'bajo':s<=r[2]?'medio':s<=r[3]?'alto':'muy_alto';}
function nivelPct(n){return{nulo:5,bajo:25,medio:50,alto:75,muy_alto:100}[n]||0;}
function avg(arr,k){if(!arr.length)return 0;return arr.reduce((s,d)=>s+(+d[k]||0),0)/arr.length;}
function badge(n){return`<span class="badge badge-${n}">${NOM_LABELS[n]||n}</span>`;}
function fmtDate(d){try{return new Date(d).toLocaleDateString('es-MX');}catch{return String(d||'—');}}
function destroyCharts(){Object.values(charts).forEach(c=>{try{c.destroy();}catch{}}); charts={};}

function go(page){
  currentPage=page;
  document.getElementById('page-title').textContent=TITLES[page]||page;
  document.querySelectorAll('.sb-btn').forEach(b=>b.classList.remove('active'));
  event?.currentTarget?.classList.add('active');
  destroyCharts();
  render(page);
}

function render(page){
  const el=document.getElementById('content');
  el.innerHTML='';
  const fn={global:renderGlobal,dominios:renderDominios,departamentos:renderDepartamentos,
    cumplimiento:renderCumplimiento,pendientes:renderPendientes,
    guia2:()=>renderTabla('g2'),guia3:()=>renderTabla('g3'),ats:()=>renderTabla('ats')};
  if(fn[page])fn[page](el);
}

// ══ SYNC ══
async function sincronizar(){
  setStatus(false,'Sincronizando…');
  try{
    const r=await fetch(GAS_URL+'?action=getAll',{redirect:'follow'});
    const d=await r.json();
    if(!d.ok)throw new Error(d.error||'Error GAS');
    G2=d.grii||[];G3=d.griii||[];ATS=d.ats||[];
    document.getElementById('cnt-g2').textContent=G2.length;
    document.getElementById('cnt-g3').textContent=G3.length;
    document.getElementById('cnt-ats').textContent=ATS.length;
    document.getElementById('sync-info').textContent='Sync: '+new Date().toLocaleTimeString('es-MX');
    setStatus(true,'Conectado');
    render(currentPage);
  }catch(e){setStatus(false,'Error: '+e.message);console.error(e);}
}
function setStatus(on,txt){
  document.getElementById('dot').className='dot'+(on?' on':'');
  document.getElementById('status-txt').textContent=txt;
}

function renderDomBars(elId,data,doms){
  const el=document.getElementById(elId);
  if(!el)return;
  el.innerHTML=doms.map(d=>{

    return`<div class="dom-row">
      <div class="dom-lbl">${d.label}</div>
      <div class="dom-bg"><div class="dom-bar" style="width:${pct}%;background:${col}"></div></div>
      <div class="dom-pct">${p.toFixed(1)}</div>
      <div class="dom-nivel">${badge(n)}</div>
    </div>`;
  }).join('');
}

function renderDepartamentos(){
  const el=document.getElementById('content');

  const rows=depts.map(dept=>{
    const items=G2.filter(d=>(d.dept||'Sin depto')===dept);

    const avgS=avg(items,'score');
    const niv=nivelG2(avgS);
    const altos=items.filter(d=>d.nivel==='alto'||d.nivel==='muy_alto').length;
    return`<tr onclick="showDeptDetail('${dept}')" style="cursor:pointer">
      <td style="font-weight:600">${dept}</td>
      <td style="text-align:center">${n}</td>
      <td style="text-align:center">${avgS.toFixed(1)}</td>

  el.innerHTML=`
  <div class="card">
    <div class="card-title">Resultados por Departamento — Guía II (${depts.length} departamentos)</div>
    <div class="tbl-wrap tbl-scroll">
      <table>
        <thead><tr><th>Departamento</th><th style="text-align:center">Evaluados</th>

}

function showDeptDetail(dept){
  const items=G2.filter(d=>(d.dept||'Sin depto')===dept);
  const bars=DOM_G2.map(d=>{
    const p=avg(items,d.key);
    const n=nivelDom(d.rangos,p);
    const pct=nivelPct(n);
    const col=NOM_COLORS[n];
    return`<div class="dom-row">
      <div class="dom-lbl">${d.label}</div>
      <div class="dom-bg"><div class="dom-bar" style="width:${pct}%;background:${col}"></div></div>
      <div class="dom-pct">${p.toFixed(1)}</div>
      <div class="dom-nivel">${badge(n)}</div>
    </div>`;
  }).join('');
  document.getElementById('modal-body').innerHTML=`
    <div class="modal-title">🗂️ ${dept}</div>
    <div class="modal-grid">
      <div class="mf"><label>Evaluados</label><span>${items.length}</span></div>
      <div class="mf"><label>Score promedio</label><span>${avg(items,'score').toFixed(1)} pts</span></div>

}

  const pct=Math.round(n/META*100);
  const pctTotal=Math.round(n/TOTAL_EMP*100);
  const col=pct>=90?'var(--green)':pct>=70?'var(--amber)':'var(--red)';

  el.innerHTML=`
  <div class="grid-3 mb-16">
    <div class="stat"><div class="stat-lbl">Muestra NOM-035</div><div class="stat-val">${META}</div><div class="stat-sub">de ${TOTAL_EMP} empleados CDMX</div></div>
    <div class="stat"><div class="stat-lbl">Evaluados</div><div class="stat-val" style="color:${col}">${n}</div><div class="stat-sub">Personas únicas Guía II</div></div>
    <div class="stat"><div class="stat-lbl">Avance</div><div class="stat-val" style="color:${col}">${pct}%</div><div class="stat-sub">${META-n} pendientes de la muestra</div></div>
  </div>
  <div class="card mb-16">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
      <span style="font-weight:700;color:var(--navy);font-size:14px">Avance vs Muestra NOM-035 (${META} personas)</span>
      <span style="font-weight:800;font-size:20px;color:${col}">${pct}%</span>
    </div>
    <div class="prog-bg" style="height:18px">
      <div class="prog-fill" style="height:18px;width:${Math.min(pct,100)}%;background:${col}"></div>
    </div>
    <div style="display:flex;justify-content:space-between;margin-top:5px;font-size:11px;color:var(--text3)">
      <span>0</span><span>Meta: ${META}</span>
    </div>
  </div>
  <div class="card mb-16">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
      <span style="font-weight:700;color:var(--navy);font-size:14px">Avance vs Total CDMX (${TOTAL_EMP} empleados)</span>
      <span style="font-weight:800;font-size:20px;color:${col}">${pctTotal}%</span>
    </div>
    <div class="prog-bg" style="height:14px">
      <div class="prog-fill" style="height:14px;width:${Math.min(pctTotal,100)}%;background:${col}"></div>
    </div>
    <div style="display:flex;justify-content:space-between;margin-top:5px;font-size:11px;color:var(--text3)">
      <span>0</span><span>Total: ${TOTAL_EMP}</span>
    </div>
  </div>
  <div class="card">
    <div class="card-title">Distribución por Nivel de Riesgo</div>
    <canvas id="ch-niv" height="160"></canvas>
  </div>`;

  charts.niv=new Chart(document.getElementById('ch-niv'),{
    type:'bar',
    data:{
      labels:NOM_NIVELES.map(n=>NOM_LABELS[n]),
      datasets:[{
        label:'Personas',
        data:NOM_NIVELES.map(nv=>G2.filter(d=>d.nivel===nv).length),
        backgroundColor:NOM_NIVELES.map(n=>NOM_COLORS[n]),
        borderRadius:6
      }]
    },
    options:{responsive:true,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,ticks:{precision:0}}}}
  });
}

// ══ PENDIENTES ══
function renderPendientes(){
  const el=document.getElementById('content');
  const evaluados=new Set(G2.map(d=>String(d.noemp||'').trim()));
  const filtro=(document.getElementById('pend-dept')||{}).value||'';
  let lista=CALENDARIO.filter(e=>!evaluados.has(String(e.noemp||'').trim()));
  if(filtro)lista=lista.filter(e=>e.dept===filtro);

  const depts=[...new Set(CALENDARIO.map(e=>e.dept||''))].sort().filter(Boolean);

  const rows=lista.map((e,i)=>`<tr style="background:${i%2?'var(--bg)':'var(--white)'};font-size:12.5px">
    <td style="color:var(--text3)">${e.noemp}</td>
    <td style="font-weight:600">${e.nombre}</td>
    <td>${e.puesto||'—'}</td>
    <td>${e.dept||'—'}</td>
    <td>${e.subdept||'—'}</td>
  </tr>`).join('');

  el.innerHTML=`
  <div class="filter-row">
    <select id="pend-dept" onchange="renderPendientes()">
      <option value="">Todos los departamentos</option>
      ${depts.map(d=>`<option value="${d}" ${filtro===d?'selected':''}>${d}</option>`).join('')}
    </select>
    <span style="font-size:13px;color:var(--text2);font-weight:600">
      ${lista.length} pendientes${filtro?' en '+filtro:' en total'}
    </span>
  </div>
  ${lista.length===0
    ?'<div class="card" style="text-align:center;padding:48px;color:var(--text3)">✅ Todos han contestado</div>'
    :`<div class="card">
      <div class="tbl-wrap tbl-scroll">
        <table>
          <thead><tr><th>No. Emp</th><th>Nombre</th><th>Puesto</th><th>Departamento</th><th>División</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    </div>`
  }`;
}

// ══ TABLAS ══
function renderTabla(tipo){
  const el=document.getElementById('content');
  const data=tipo==='g2'?G2:tipo==='g3'?G3:ATS;

  const colsG2=['noemp','nombre','dept','score','nivel','catAmbiente','catFactores','catOrg','catLiderazgo','catViolencia'];
  const colsG3=['noemp','nombre','dept','score','nivel','catAmb3','catFactores3','catOrg3','catLid3','catViol3','catEntorno3'];
  const colsATS=['noemp','nombre','dept','tipoEvento','fechaEvento','rol','atencion'];
  const cols=tipo==='g2'?colsG2:tipo==='g3'?colsG3:colsATS;

  const hdrs={noemp:'No.Emp',nombre:'Nombre',dept:'Depto',score:'Score',nivel:'Nivel',
    catAmbiente:'Ambiente',catFactores:'Carga',catOrg:'Org.Tiempo',catLiderazgo:'Liderazgo',catViolencia:'Violencia',
    catAmb3:'Amb.',catFactores3:'Carga',catOrg3:'Org.',catLid3:'Liderazgo',catViol3:'Violencia',catEntorno3:'Entorno',
    tipoEvento:'Tipo',fechaEvento:'Fecha',rol:'Rol',atencion:'Atención'};

  const rows=data.map((d,i)=>{
    const tds=cols.map(c=>{
      if(c==='nivel')return`<td>${badge(d.nivel||nivelG2(d.score||0))}</td>`;
      if(c==='nombre')return`<td style="font-weight:600;white-space:nowrap">${d[c]||'—'}</td>`;
      if(c==='fechaEvento')return`<td>${fmtDate(d[c])}</td>`;
      return`<td>${d[c]||'—'}</td>`;
    }).join('');
    return`<tr style="background:${i%2?'var(--bg)':'var(--white)'}" onclick="showDetalle('${tipo}',${i})" style="cursor:pointer">${tds}</tr>`;
  }).join('');

  el.innerHTML=`
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
      <span style="font-size:13px;font-weight:700;color:var(--navy)">${data.length} registros</span>
      <button class="btn btn-outline btn-sm" onclick="exportarExcel('${tipo}')">📥 Excel</button>
    </div>
    <div class="tbl-wrap tbl-scroll">
      <table>
        <thead><tr>${cols.map(c=>`<th>${hdrs[c]||c}</th>`).join('')}</tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
    <p style="font-size:11px;color:var(--text3);margin-top:8px">Clic en una fila para ver detalle completo</p>
  </div>`;
}

function showDetalle(tipo,idx){
  const d=tipo==='g2'?G2[idx]:tipo==='g3'?G3[idx]:ATS[idx];
  if(!d)return;
  const doms=tipo==='g2'?DOM_G2:DOM_G3;
  const nivelFn=tipo==='g2'?nivelG2:nivelG3;

  if(tipo==='ats'){
    document.getElementById('modal-body').innerHTML=`
      <div class="modal-title">⚠️ ${d.nombre||'—'}</div>
      <div class="modal-grid">
        <div class="mf"><label>No. Empleado</label><span>${d.noemp||'—'}</span></div>
        <div class="mf"><label>Departamento</label><span>${d.dept||'—'}</span></div>
        <div class="mf"><label>Tipo de Evento</label><span>${d.tipoEvento||'—'}</span></div>
        <div class="mf"><label>Fecha</label><span>${fmtDate(d.fechaEvento)}</span></div>
        <div class="mf"><label>Rol</label><span>${d.rol||'—'}</span></div>
        <div class="mf"><label>Resultado ATS</label><span style="font-weight:800;color:${d.atencion?.includes('Requiere')?'var(--red)':'var(--green)'}">${d.atencion||'—'}</span></div>
      </div>`;
  }else{
    const bars=doms.map(dm=>{
      const val=+d[dm.key]||0;
      const nv=nivelDom(dm.rangos,val);
      const pct=nivelPct(nv);
      const col=NOM_COLORS[nv];
      return`<div class="dom-row">
        <div class="dom-lbl">${dm.label}</div>
        <div class="dom-bg"><div class="dom-bar" style="width:${pct}%;background:${col}"></div></div>
        <div class="dom-pct">${val}</div>
        <div class="dom-nivel">${badge(nv)}</div>
      </div>`;
    }).join('');
    document.getElementById('modal-body').innerHTML=`
      <div class="modal-title">${d.nombre||'—'}</div>
      <div class="modal-grid">
        <div class="mf"><label>No. Empleado</label><span>${d.noemp||'—'}</span></div>
        <div class="mf"><label>Puesto</label><span>${d.puesto||'—'}</span></div>
        <div class="mf"><label>Departamento</label><span>${d.dept||'—'}</span></div>
        <div class="mf"><label>Score Total</label><span style="font-size:22px;font-weight:800;color:var(--navy)">${d.score||0} pts</span></div>
        <div class="mf"><label>Nivel de Riesgo</label><span>${badge(d.nivel||nivelFn(d.score))}</span></div>
        <div class="mf"><label>Fecha</label><span>${fmtDate(d.fecha)}</span></div>
      </div>
      <div style="font-size:12px;font-weight:700;color:var(--navy);margin-bottom:10px">Desglose por Dominio</div>
      ${bars}`;
  }
  document.getElementById('modal-bg').classList.add('show');
}

// ══ EXCEL ══
function exportarExcel(tipo){
  const wb=XLSX.utils.book_new();
  const add=(data,name)=>{if(data.length)XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(data),name);};
  if(!tipo||tipo==='g2') add(G2,'Guia_II');
  if(!tipo||tipo==='g3') add(G3,'Guia_III');
  if(!tipo||tipo==='ats')add(ATS,'ATS');
  XLSX.writeFile(wb,'NOM035_CDMX_'+new Date().toISOString().slice(0,10)+'.xlsx');
}

// ══ PDF ══
async function generarPDF(){
  const ov=document.getElementById('pdf-ov');
  const msg=document.getElementById('pdf-msg');
  ov.classList.add('show');
  await new Promise(r=>setTimeout(r,100));
  try{
    const {jsPDF}=window.jspdf;
    const doc=new jsPDF({orientation:'portrait',unit:'mm',format:'letter'});
    const PW=215.9,PH=279.4,M=14,CW=PW-M*2;
    const NAVY=[13,43,90],WHITE=[255,255,255],GRAY=[240,244,250],TEXT=[15,23,42],TEXT2=[100,116,139];
    const NC={nulo:[46,125,50],bajo:[249,168,37],medio:[239,108,0],alto:[198,40,40],muy_alto:[106,27,154]};
    const NB={nulo:[232,245,233],bajo:[255,248,225],medio:[255,243,224],alto:[255,235,238],muy_alto:[243,229,245]};
    const NL={nulo:'Nulo',bajo:'Bajo',medio:'Medio',alto:'Alto',muy_alto:'Muy Alto'};

    const hdr=(p)=>{
      doc.setFillColor(...NAVY);doc.rect(0,0,PW,16,'F');
      doc.setFontSize(9);doc.setFont('helvetica','bold');doc.setTextColor(...WHITE);
      doc.text('TELEFLEX CDMX — NOM-035-STPS-2018  |  Análisis de Resultados',M,10);
      doc.setFontSize(7);doc.setFont('helvetica','normal');doc.setTextColor(150,170,200);
      doc.text('Dr. Jaime Iván Martínez Espinoza  |  Cédula 12021447  |  Ciudad de México',M,14.5);
      doc.text('Pág.'+p,PW-M,10,{align:'right'});
    };
    const ftr=()=>{
      doc.setFillColor(...NAVY);doc.rect(0,PH-10,PW,10,'F');
      doc.setFontSize(7);doc.setTextColor(150,170,200);
      const f=new Date().toLocaleDateString('es-MX',{day:'2-digit',month:'long',year:'numeric'});
      doc.text('Generado el '+f+' | Teleflex CDMX',PW/2,PH-4,{align:'center'});
    };
    const cellNiv=(x,y,w,h,nv)=>{
      const bg=NB[nv]||[240,240,240];const c=NC[nv]||[100,100,100];
      doc.setFillColor(...bg);doc.rect(x,y,w,h,'F');
      doc.setDrawColor(...c);doc.setLineWidth(0.3);doc.rect(x,y,w,h,'S');
      doc.setFillColor(...c);doc.circle(x+3.5,y+h/2,1.2,'F');
      doc.setFontSize(8);doc.setFont('helvetica','bold');doc.setTextColor(...c);
      doc.text(NL[nv]||nv,x+6,y+h/2+0.5,{baseline:'middle'});
    };

    let pg=1;hdr(pg);ftr();
    let y=22;

    // PORTADA
    doc.setFillColor(...NAVY);doc.rect(M,y,CW,36,'F');
    doc.setFontSize(18);doc.setFont('helvetica','bold');doc.setTextColor(...WHITE);
    doc.text('NOM-035-STPS-2018',M+8,y+12);
    doc.setFontSize(11);doc.setFont('helvetica','normal');
    doc.text('Análisis de Resultados — Teleflex Ciudad de México',M+8,y+21);
    doc.setFontSize(9);doc.setTextColor(180,200,220);
    doc.text(new Date().toLocaleDateString('es-MX',{month:'long',year:'numeric'}),M+8,y+30);
    y+=43;

    // STAT BOXES
    const n=G2.length,muAlto=G2.filter(d=>d.nivel==='muy_alto').length;
    const alto=G2.filter(d=>d.nivel==='alto').length,medio=G2.filter(d=>d.nivel==='medio').length;
    const avgS=n?Math.round(avg(G2,'score')):0;
    const boxes=[
      {l:'Total Evaluados',v:String(n),s:'de '+TOTAL_EMP+' empleados',c:NAVY},
      {l:'Muy Alto',v:String(muAlto),s:'Intervención urgente',c:NC.muy_alto},
      {l:'Alto',v:String(alto),s:'Plan de acción',c:NC.alto},
      {l:'Medio',v:String(medio),s:'Seguimiento',c:NC.medio},
      {l:'Score Promedio',v:String(avgS)+' pts',s:'Guía II global',c:NAVY},
    ];
    const bw=(CW-8)/3,bh=22;
    boxes.forEach((b,i)=>{
      const bx=M+(i%3)*(bw+4),by=y+Math.floor(i/3)*(bh+4);
      doc.setFillColor(...GRAY);doc.rect(bx,by,bw,bh,'F');
      doc.setFillColor(...b.c);doc.rect(bx,by,3,bh,'F');
      doc.setFontSize(7);doc.setFont('helvetica','bold');doc.setTextColor(...TEXT2);doc.text(b.l,bx+6,by+5.5);
      doc.setFontSize(14);doc.setFont('helvetica','bold');doc.setTextColor(...b.c);doc.text(b.v,bx+6,by+13.5);
      doc.setFontSize(6.5);doc.setFont('helvetica','normal');doc.setTextColor(...TEXT2);doc.text(b.s,bx+6,by+19);
    });
    y+=bh*2+12;

    // DOMINIOS G2
    doc.setFontSize(11);doc.setFont('helvetica','bold');doc.setTextColor(...NAVY);
    doc.text('Desglose por Dominio — Guía II',M,y);y+=7;
    DOM_G2.forEach(d=>{
      const p=avg(G2,d.key);const nv=nivelDom(d.rangos,p);
      const pct=nivelPct(nv)/100;const c=NC[nv]||[100,100,100];
      doc.setFontSize(7.5);doc.setFont('helvetica','normal');doc.setTextColor(...TEXT);
      doc.text(d.label,M,y+3.5);
      doc.setFillColor(...GRAY);doc.rect(M+52,y,CW-80,5,'F');
      if(pct>0){doc.setFillColor(...c);doc.rect(M+52,y,(CW-80)*pct,5,'F');}
      doc.setFontSize(7);doc.setTextColor(...TEXT2);doc.text(p.toFixed(1),M+CW-25,y+3.5);
      cellNiv(M+CW-22,y,20,5.5,nv);
      y+=8;if(y>240){doc.addPage();pg++;hdr(pg);ftr();y=22;}
    });
    y+=6;

    // DOMINIOS G3
    if(G3.length>0){
      if(y>210){doc.addPage();pg++;hdr(pg);ftr();y=22;}
      doc.setFontSize(11);doc.setFont('helvetica','bold');doc.setTextColor(...NAVY);
      doc.text('Desglose por Dominio — Guía III',M,y);y+=7;
      DOM_G3.forEach(d=>{
        const p=avg(G3,d.key);const nv=nivelDom(d.rangos,p);
        const pct=nivelPct(nv)/100;const c=NC[nv]||[100,100,100];
        doc.setFontSize(7.5);doc.setFont('helvetica','normal');doc.setTextColor(...TEXT);
        doc.text(d.label,M,y+3.5);
        doc.setFillColor(...GRAY);doc.rect(M+52,y,CW-80,5,'F');
        if(pct>0){doc.setFillColor(...c);doc.rect(M+52,y,(CW-80)*pct,5,'F');}
        doc.setFontSize(7);doc.setTextColor(...TEXT2);doc.text(p.toFixed(1),M+CW-25,y+3.5);
        cellNiv(M+CW-22,y,20,5.5,nv);
        y+=8;if(y>240){doc.addPage();pg++;hdr(pg);ftr();y=22;}
      });
      y+=6;
    }

    // ATS
    if(ATS.length>0){
      if(y>210){doc.addPage();pg++;hdr(pg);ftr();y=22;}
      doc.setFontSize(11);doc.setFont('helvetica','bold');doc.setTextColor(...NAVY);
      doc.text('Acontecimiento Traumático Severo — '+ATS.length+' reporte(s)',M,y);y+=7;
      ATS.slice(0,20).forEach(a=>{
        doc.setFontSize(7.5);doc.setFont('helvetica','normal');doc.setTextColor(...TEXT);
        doc.text((a.nombre||'—').substring(0,30),M,y+3.5);
        doc.text(a.tipoEvento||'—',M+65,y+3.5);
        const atenCol=a.atencion?.includes('Requiere')?[198,40,40]:[46,125,50];
        doc.setTextColor(...atenCol);doc.setFont('helvetica','bold');
        doc.text(a.atencion||'—',M+110,y+3.5);
        doc.setTextColor(...TEXT);doc.setFont('helvetica','normal');
        y+=6;if(y>255){doc.addPage();pg++;hdr(pg);ftr();y=22;}
      });
    }

    if(msg)msg.textContent='Guardando…';
    doc.save('NOM035_CDMX_'+new Date().toISOString().slice(0,10)+'.pdf');
  }catch(e){console.error(e);alert('Error PDF: '+e.message);}
  finally{ov.classList.remove('show');}
}

// ══ INICIO ══
go('global');
sincronizar();
</script>
